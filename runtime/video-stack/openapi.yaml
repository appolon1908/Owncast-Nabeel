openapi: 3.0.3
info:
  title: Codestra Owncast Connector
  version: 1.0.0
  description: Normalized API for the canonical Owncast runtime on codestra-desktop.
servers:
  - url: http://127.0.0.1:18104
paths:
  /health:
    get:
      responses:
        "200": {description: Desktop bridge and Owncast health}
  /v1/status:
    get:
      responses:
        "200": {description: Owncast server status}
  /v1/chat:
    get:
      responses:
        "200": {description: Chat history}
  /v1/clients:
    get:
      responses:
        "200": {description: Connected chat clients}
  /v1/users/{userId}:
    get:
      parameters:
        - {in: path, name: userId, required: true, schema: {type: string}}
      responses:
        "200": {description: Owncast chat user details}
  /v1/chat/system:
    post:
      responses:
        "200": {description: System chat message sent}
        "423": {description: Mutations disabled}
  /v1/chat/send:
    post:
      responses:
        "200": {description: Standard chat message sent}
        "423": {description: Mutations disabled}
  /v1/chat/action:
    post:
      responses:
        "200": {description: Chat action sent}
        "423": {description: Mutations disabled}
  /v1/chat/messagevisibility:
    post:
      responses:
        "200": {description: Message visibility changed}
        "423": {description: Mutations disabled}
  /v1/stream/title:
    post:
      responses:
        "200": {description: Stream title updated}
        "423": {description: Mutations disabled}
  /v1/chat/system/client/{clientId}:
    post:
      parameters:
        - {in: path, name: clientId, required: true, schema: {type: string}}
      responses:
        "200": {description: System message sent to one client}
        "423": {description: Mutations disabled}
  /v1/webhooks/recent:
    get:
      responses:
        "200": {description: Recently verified webhook events}
  /v1/webhooks/owncast:
    post:
      description: LAN ingress used by the canonical desktop Owncast instance. Validates owncast-signature and a 5-minute replay window.
      responses:
        "202": {description: Signed event accepted}
        "401": {description: Invalid signature}
        "422": {description: Unsupported event}
